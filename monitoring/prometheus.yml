global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'ecommerce-server'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['server:5000']
    # If METRICS_BEARER_TOKEN is enabled in production, Prometheus uses Bearer authorization:
    # authorization:
    #   type: Bearer
    #   credentials: ''
