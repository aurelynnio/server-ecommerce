apiVersion: 1

groups:
  - orgId: 1
    name: mia-chatbot
    folder: Chatbot
    interval: 30s
    rules:
      - uid: chatbot-high-error-rate
        title: Mia Chatbot - high error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(chatbot_errors_total[5m])) / clamp_min(sum(rate(chatbot_requests_total[5m])), 0.0001)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              expression: A
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Chatbot error rate > 5%
          description: |
            Tỷ lệ lỗi trong 5 phút vượt 5%. Kiểm tra Mistral API,
            Redis cache, hoặc lỗi DB.
        labels:
          severity: warning
          service: mia-chatbot

      - uid: chatbot-high-latency
        title: Mia Chatbot - p95 latency > 5s
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(chatbot_latency_seconds_bucket[5m])))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              expression: A
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Chatbot p95 latency > 5s
          description: |
            Latency p95 vượt 5s. Kiểm tra Mistral API, vector search
            hoặc rate of cache hit.
        labels:
          severity: warning
          service: mia-chatbot

      - uid: chatbot-hallucination-spike
        title: Mia Chatbot - hallucination spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(chatbot_hallucination_total[1h]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
              expression: A
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: >20 hallucinations in last hour
          description: |
            Có hơn 20 response bị replace do hallucination. Có thể
            do grounding check hoặc prompt thiếu constraints.
        labels:
          severity: info
          service: mia-chatbot
