name: Server CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ecommerce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t backend_ecommerce:${{ github.sha }} .

  deploy:
    name: Push ECR and Deploy EC2
    runs-on: ubuntu-latest
    needs: [docker-check, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set image URI
        id: image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_URI" \
            .

      - name: Push Docker image to ECR
        run: docker push "$IMAGE_URI"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            AWS_REGION="${{ vars.AWS_REGION }}"
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            IMAGE_URI="${{ steps.image.outputs.IMAGE_URI }}"

            cd /srv/ecommerce

            echo "Starting infrastructure containers..."
            docker compose up -d mongodb redis rabbitmq

            NETWORK_NAME="$(docker network ls --format '{{.Name}}' | grep -E '^(ecommerce-network|ecommerce_ecommerce-network)$' | head -n 1)"

            if [ -z "$NETWORK_NAME" ]; then
              echo "Docker network not found. Creating ecommerce-network..."
              docker network create ecommerce-network
              NETWORK_NAME="ecommerce-network"
            fi

            echo "Using Docker network: $NETWORK_NAME"

            echo "Logging in to ECR..."
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "Pulling new backend image..."
            docker pull "$IMAGE_URI"

            echo "Stopping old backend container..."
            docker stop backend_ecommerce || true
            docker rm backend_ecommerce || true

            echo "Starting new backend container..."
            docker run -d \
              --name backend_ecommerce \
              --restart unless-stopped \
              --network "$NETWORK_NAME" \
              -p 5000:5000 \
              --env-file /home/ubuntu/.env.backend \
              "$IMAGE_URI"

            echo "Backend container status:"
            docker ps --filter "name=backend_ecommerce"

            echo "Recent backend logs:"
            docker logs backend_ecommerce --tail=80 || true

            echo "Cleaning old images..."
            docker image prune -af
